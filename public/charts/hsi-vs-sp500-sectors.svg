<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-labelledby="hsi-title hsi-desc">
  <title id="hsi-title">Hang Seng vs S&amp;P 500 Sector Weights (2026)</title>
  <desc id="hsi-desc">Paired horizontal bars comparing sector weights: HSI dominated by Financials (33.9%), S&amp;P 500 by Technology (39.2%)</desc>
  <defs>
    <linearGradient id="hsiGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="spxGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
  </defs>

  <rect width="700" height="440" fill="#fafbfc" rx="8"/>

  <text x="40" y="38" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Two Indexes, Two Economies: Sector Weights (2026)</text>
  <text x="40" y="58" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#64748b">Hang Seng Index vs S&amp;P 500 sector breakdown. Source: Hang Seng Indexes, S&amp;P Dow Jones.</text>

  <!-- Scale: 40% = 340px from x=160 (8.5px/%). Gridlines at 10/20/30/40% -->
  <line x1="160" y1="80" x2="160" y2="376" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="245" y1="80" x2="245" y2="376" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="330" y1="80" x2="330" y2="376" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="415" y1="80" x2="415" y2="376" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="500" y1="80" x2="500" y2="376" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="160" y="394" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">0%</text>
  <text x="245" y="394" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">10%</text>
  <text x="330" y="394" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">20%</text>
  <text x="415" y="394" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">30%</text>
  <text x="500" y="394" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">40%</text>

  <!-- Row centers: 100, 152, 204, 256, 308, 360 -->

  <!-- Financials: HSI 33.9 (288), SPX 11.1 (94) -->
  <text x="150" y="104" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">Financials</text>
  <rect x="160" y="84" width="288" height="14" rx="3" fill="url(#hsiGrad)"/>
  <text x="454" y="95" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#059669" font-weight="700">33.9%</text>
  <rect x="160" y="102" width="94" height="14" rx="3" fill="url(#spxGrad)"/>
  <text x="260" y="113" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#2563eb" font-weight="600">11.1%</text>

  <!-- Consumer Cyclical: HSI 19.7 (167), SPX 10.0 (85) -->
  <text x="150" y="156" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">Consumer Cyclical</text>
  <rect x="160" y="136" width="167" height="14" rx="3" fill="url(#hsiGrad)"/>
  <text x="333" y="147" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#059669" font-weight="700">19.7%</text>
  <rect x="160" y="154" width="85" height="14" rx="3" fill="url(#spxGrad)"/>
  <text x="251" y="165" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#2563eb" font-weight="600">10.0%</text>

  <!-- Communication: HSI 14.6 (124), SPX 9.0 (77) -->
  <text x="150" y="208" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">Communication</text>
  <rect x="160" y="188" width="124" height="14" rx="3" fill="url(#hsiGrad)"/>
  <text x="290" y="199" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#059669" font-weight="700">14.6%</text>
  <rect x="160" y="206" width="77" height="14" rx="3" fill="url(#spxGrad)"/>
  <text x="243" y="217" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#2563eb" font-weight="600">9.0%</text>

  <!-- Technology: HSI 6.1 (52), SPX 39.2 (333) -->
  <text x="150" y="260" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">Technology</text>
  <rect x="160" y="240" width="52" height="14" rx="3" fill="url(#hsiGrad)"/>
  <text x="218" y="251" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#059669" font-weight="700">6.1%</text>
  <rect x="160" y="258" width="333" height="14" rx="3" fill="url(#spxGrad)"/>
  <text x="499" y="269" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#2563eb" font-weight="700">39.2%</text>

  <!-- Healthcare: HSI 3.8 (32), SPX 11.3 (96) -->
  <text x="150" y="312" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">Healthcare</text>
  <rect x="160" y="292" width="32" height="14" rx="3" fill="url(#hsiGrad)"/>
  <text x="198" y="303" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#059669" font-weight="700">3.8%</text>
  <rect x="160" y="310" width="96" height="14" rx="3" fill="url(#spxGrad)"/>
  <text x="262" y="321" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#2563eb" font-weight="600">11.3%</text>

  <!-- Energy: HSI 6.0 (51), SPX 3.8 (32) -->
  <text x="150" y="364" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">Energy</text>
  <rect x="160" y="344" width="51" height="14" rx="3" fill="url(#hsiGrad)"/>
  <text x="217" y="355" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#059669" font-weight="700">6.0%</text>
  <rect x="160" y="362" width="32" height="14" rx="3" fill="url(#spxGrad)"/>
  <text x="198" y="373" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#2563eb" font-weight="600">3.8%</text>

  <!-- Legend -->
  <rect x="160" y="408" width="12" height="12" rx="2" fill="#10b981"/>
  <text x="178" y="419" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#475569">Hang Seng Index</text>
  <rect x="310" y="408" width="12" height="12" rx="2" fill="#3b82f6"/>
  <text x="328" y="419" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#475569">S&amp;P 500</text>
</svg>
