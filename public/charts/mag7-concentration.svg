<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-labelledby="mag7-title mag7-desc">
  <title id="mag7-title">Magnificent Seven Weight in S&amp;P 500 (2014–2026)</title>
  <desc id="mag7-desc">Area chart showing Mag7 weight growing from 12% in 2014 to 35% in mid-2026</desc>
  <defs>
    <linearGradient id="mag7Area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb" stop-opacity="0.2"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/></linearGradient>
  </defs>

  <rect width="700" height="380" fill="#fafbfc" rx="8"/>

  <text x="40" y="36" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700" fill="#0f172a">S&amp;P 500 Top-10 and Magnificent Seven Concentration (2014–2026)</text>
  <text x="40" y="56" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#64748b">Weight of largest stocks in the S&amp;P 500 index. Source: S&amp;P Dow Jones Indices, Bloomberg.</text>

  <!-- Chart: x at 100, 187, 275, 362, 450, 537, 600 (7 points). y=310 baseline. Range 0-40%. y0=310, y40=310-240=70. Each 1%=6px -->
  <line x1="60" y1="310" x2="620" y2="310" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="60" y1="250" x2="620" y2="250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="190" x2="620" y2="190" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="130" x2="620" y2="130" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="60" y1="70" x2="620" y2="70" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="50" y="314" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">0%</text>
  <text x="50" y="254" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">10%</text>
  <text x="50" y="194" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">20%</text>
  <text x="50" y="134" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">30%</text>
  <text x="50" y="74" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">40%</text>

  <!-- Data: Top10 as line, Mag7 as area -->
  <!-- Top10: 2014(18%→202), 2016(20%→190), 2019(23%→172), 2021(28%→142), 2023(31%→124), 2024(33%→112), 2026(37%→88) -->
  <!-- Mag7: 2014(12%→238), 2016(14%→226), 2019(17%→208), 2021(24%→166), 2023(27%→148), 2024(30%→130), 2026(35%→100) -->

  <!-- Mag7 area -->
  <polygon points="100,238 187,226 275,208 362,166 450,148 537,130 600,100 600,310 100,310" fill="url(#mag7Area)"/>

  <!-- Top10 line -->
  <polyline points="100,202 187,190 275,172 362,142 450,124 537,112 600,88" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,3" stroke-linejoin="round"/>

  <!-- Mag7 area edge line -->
  <polyline points="100,238 187,226 275,208 362,166 450,148 537,130 600,100" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Dots + labels -->
  <circle cx="100" cy="202" r="3.5" fill="#94a3b8"/>
  <circle cx="600" cy="88" r="3.5" fill="#94a3b8"/>
  <text x="600" y="80" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" font-weight="600" text-anchor="middle">37%</text>

  <circle cx="100" cy="238" r="4" fill="#2563eb"/>
  <text x="100" y="245" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">12%</text>
  <circle cx="600" cy="100" r="4" fill="#2563eb"/>
  <text x="600" y="90" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">35%</text>

  <!-- X-axis labels -->
  <text x="100" y="330" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2014</text>
  <text x="187" y="330" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2016</text>
  <text x="275" y="330" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2019</text>
  <text x="362" y="330" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2021</text>
  <text x="450" y="330" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2023</text>
  <text x="537" y="330" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2024</text>
  <text x="600" y="330" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2026</text>

  <!-- Legend -->
  <rect x="460" y="68" width="160" height="48" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="472" y="80" width="16" height="2" rx="1" fill="#2563eb"/>
  <circle cx="480" cy="81" r="3" fill="#2563eb"/>
  <text x="494" y="85" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#334155">Magnificent Seven</text>
  <line x1="472" y1="100" x2="488" y2="100" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="494" y="104" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#334155">S&amp;P 500 Top 10</text>
</svg>
