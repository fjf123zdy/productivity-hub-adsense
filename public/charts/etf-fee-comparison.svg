<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="fee-title fee-desc">
  <title id="fee-title">US vs China ETF Expense Ratio Comparison (2026)</title>
  <desc id="fee-desc">Horizontal bar chart comparing VOO (0.03%), IVV (0.03%), SPY (0.09%), 510300 CSI 300 (0.20%), 512100 CSI 500 (0.20%), ASHR CSI 300 US-listed (0.65%), MCHI MSCI China (0.59%), SMH Semiconductor (0.35%)</desc>
  <defs>
    <linearGradient id="feeGradUS" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="feeGradCN" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="feeGradCB" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="feeGradSect" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="420" fill="#fafbfc" rx="8"/>

  <!-- Title -->
  <text x="40" y="38" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700" fill="#0f172a">ETF Expense Ratio Comparison (2026)</text>
  <text x="40" y="58" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#64748b">Lower is better. Source: fund provider filings, mid-2026.</text>

  <!-- Grid lines -->
  <line x1="160" y1="80" x2="160" y2="370" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="300" y1="80" x2="300" y2="370" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="440" y1="80" x2="440" y2="370" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="580" y1="80" x2="580" y2="370" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- X-axis labels -->
  <text x="160" y="390" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">0.00%</text>
  <text x="300" y="390" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">0.20%</text>
  <text x="440" y="390" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">0.40%</text>
  <text x="580" y="390" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">0.60%</text>

  <!-- Baseline -->
  <line x1="160" y1="375" x2="620" y2="375" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Chart area: y positions at 90, 122, 154, 186, 218, 250, 282, 314 -->
  <!-- Each bar: width = (er / 0.70%) * 460px. 0.70% = 460px. -->

  <!-- VOO 0.03% → 19.7px -->
  <rect x="160" y="90" width="20" height="22" rx="3" fill="url(#feeGradUS)"/>
  <text x="150" y="105" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">VOO (S&amp;P 500)</text>
  <text x="186" y="105" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="600">0.03%</text>
  <text x="630" y="105" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">$3/yr on $10K</text>

  <!-- IVV 0.03% → 19.7px -->
  <rect x="160" y="122" width="20" height="22" rx="3" fill="url(#feeGradUS)"/>
  <text x="150" y="137" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">IVV (S&amp;P 500)</text>
  <text x="186" y="137" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="600">0.03%</text>
  <text x="630" y="137" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">$3/yr on $10K</text>

  <!-- SPY 0.0945% → 62.1px -->
  <rect x="160" y="154" width="62" height="22" rx="3" fill="url(#feeGradUS)"/>
  <text x="150" y="169" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">SPY (S&amp;P 500)</text>
  <text x="228" y="169" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="600">0.09%</text>
  <text x="630" y="169" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">$9/yr on $10K</text>

  <!-- 510300 0.20% → 131.4px -->
  <rect x="160" y="186" width="131" height="22" rx="3" fill="url(#feeGradCN)"/>
  <text x="150" y="201" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">510300 (CSI 300)</text>
  <text x="297" y="201" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#dc2626" font-weight="600">0.20%</text>
  <text x="630" y="201" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">$20/yr on $10K</text>

  <!-- SMH 0.35% → 230px -->
  <rect x="160" y="218" width="230" height="22" rx="3" fill="url(#feeGradSect)"/>
  <text x="150" y="233" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">SMH (Semiconductor)</text>
  <text x="396" y="233" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#64748b" font-weight="600">0.35%</text>
  <text x="630" y="233" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">$35/yr on $10K</text>

  <!-- MCHI 0.59% → 387.7px -->
  <rect x="160" y="250" width="388" height="22" rx="3" fill="url(#feeGradCB)"/>
  <text x="150" y="265" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">MCHI (MSCI China)</text>
  <text x="554" y="265" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#7c3aed" font-weight="600">0.59%</text>
  <text x="630" y="265" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">$59/yr on $10K</text>

  <!-- ASHR 0.65% → 427.1px -->
  <rect x="160" y="282" width="427" height="22" rx="3" fill="url(#feeGradCB)"/>
  <text x="150" y="297" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">ASHR (CSI 300 US)</text>
  <text x="593" y="297" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#7c3aed" font-weight="600">0.65%</text>
  <text x="630" y="297" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">$65/yr on $10K</text>

  <!-- QDII ETF 0.80% → 525.7px -->
  <rect x="160" y="314" width="526" height="22" rx="3" fill="url(#feeGradCB)"/>
  <text x="150" y="329" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">Nasdaq-100 QDII</text>
  <text x="632" y="329" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#7c3aed" font-weight="600">0.80%</text>
  <text x="630" y="347" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">$80/yr on $10K</text>

  <!-- Legend -->
  <rect x="40" y="370" width="12" height="12" rx="2" fill="#3b82f6"/>
  <text x="58" y="381" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#475569">US ETF</text>
  <rect x="120" y="370" width="12" height="12" rx="2" fill="#ef4444"/>
  <text x="138" y="381" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#475569">China Onshore</text>
  <rect x="240" y="370" width="12" height="12" rx="2" fill="#8b5cf6"/>
  <text x="258" y="381" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#475569">Cross-Border / QDII</text>
  <rect x="380" y="370" width="12" height="12" rx="2" fill="#94a3b8"/>
  <text x="398" y="381" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#475569">Sector ETF</text>
</svg>
