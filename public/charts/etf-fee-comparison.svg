<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" role="img" aria-labelledby="fee-title fee-desc">
  <title id="fee-title">US vs China ETF Expense Ratio Comparison (2026)</title>
  <desc id="fee-desc">Horizontal bar chart comparing VOO (0.03%), IVV (0.03%), SPY (0.09%), 510300 CSI 300 (0.20%), SMH Semiconductor (0.35%), MCHI MSCI China (0.59%), ASHR CSI 300 US-listed (0.65%), Nasdaq-100 QDII (0.80%)</desc>
  <defs>
    <linearGradient id="feeGradUS" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="feeGradCN" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="feeGradCB" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="feeGradSect" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="410" fill="#fafbfc" rx="8"/>

  <!-- Title -->
  <text x="40" y="38" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700" fill="#0f172a">ETF Expense Ratio Comparison (2026)</text>
  <text x="40" y="58" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#64748b">Lower is better. Source: fund provider filings, mid-2026.</text>

  <!-- Grid lines: 0.70% = 460px from x=160 -->
  <line x1="160" y1="80" x2="160" y2="345" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="300" y1="80" x2="300" y2="345" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="440" y1="80" x2="440" y2="345" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="580" y1="80" x2="580" y2="345" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Baseline -->
  <line x1="160" y1="345" x2="690" y2="345" stroke="#cbd5e1" stroke-width="1"/>

  <!-- X-axis labels -->
  <text x="160" y="363" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">0.00%</text>
  <text x="300" y="363" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">0.20%</text>
  <text x="440" y="363" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">0.40%</text>
  <text x="580" y="363" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">0.60%</text>

  <!-- Row centers: 101, 133, 165, 197, 229, 261, 293, 325 -->

  <!-- VOO 0.03% -->
  <rect x="160" y="90" width="20" height="22" rx="3" fill="url(#feeGradUS)"/>
  <text x="150" y="99" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">VOO (S&amp;P 500)</text>
  <text x="150" y="112" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">$3/yr per $10K</text>
  <text x="186" y="106" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="700">0.03%</text>

  <!-- IVV 0.03% -->
  <rect x="160" y="122" width="20" height="22" rx="3" fill="url(#feeGradUS)"/>
  <text x="150" y="131" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">IVV (S&amp;P 500)</text>
  <text x="150" y="144" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">$3/yr per $10K</text>
  <text x="186" y="138" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="700">0.03%</text>

  <!-- SPY 0.0945% -->
  <rect x="160" y="154" width="62" height="22" rx="3" fill="url(#feeGradUS)"/>
  <text x="150" y="163" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">SPY (S&amp;P 500)</text>
  <text x="150" y="176" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">$9/yr per $10K</text>
  <text x="228" y="170" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="700">0.09%</text>

  <!-- 510300 0.20% -->
  <rect x="160" y="186" width="131" height="22" rx="3" fill="url(#feeGradCN)"/>
  <text x="150" y="195" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">510300 (CSI 300)</text>
  <text x="150" y="208" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">$20/yr per $10K</text>
  <text x="297" y="202" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#dc2626" font-weight="700">0.20%</text>

  <!-- SMH 0.35% -->
  <rect x="160" y="218" width="230" height="22" rx="3" fill="url(#feeGradSect)"/>
  <text x="150" y="227" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">SMH (Semiconductor)</text>
  <text x="150" y="240" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">$35/yr per $10K</text>
  <text x="396" y="234" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#64748b" font-weight="700">0.35%</text>

  <!-- MCHI 0.59% -->
  <rect x="160" y="250" width="388" height="22" rx="3" fill="url(#feeGradCB)"/>
  <text x="150" y="259" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">MCHI (MSCI China)</text>
  <text x="150" y="272" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">$59/yr per $10K</text>
  <text x="554" y="266" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#7c3aed" font-weight="700">0.59%</text>

  <!-- ASHR 0.65% -->
  <rect x="160" y="282" width="427" height="22" rx="3" fill="url(#feeGradCB)"/>
  <text x="150" y="291" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">ASHR (CSI 300 US)</text>
  <text x="150" y="304" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">$65/yr per $10K</text>
  <text x="593" y="298" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#7c3aed" font-weight="700">0.65%</text>

  <!-- QDII 0.80% — bar reaches 686, label inside bar (white) -->
  <rect x="160" y="314" width="526" height="22" rx="3" fill="url(#feeGradCB)"/>
  <text x="150" y="323" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">Nasdaq-100 QDII</text>
  <text x="150" y="336" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">$80/yr per $10K</text>
  <text x="678" y="330" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#ffffff" font-weight="700" text-anchor="end">0.80%</text>

  <!-- Legend -->
  <rect x="40" y="378" width="12" height="12" rx="2" fill="#3b82f6"/>
  <text x="58" y="389" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#475569">US ETF</text>
  <rect x="120" y="378" width="12" height="12" rx="2" fill="#ef4444"/>
  <text x="138" y="389" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#475569">China Onshore</text>
  <rect x="240" y="378" width="12" height="12" rx="2" fill="#8b5cf6"/>
  <text x="258" y="389" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#475569">Cross-Border / QDII</text>
  <rect x="392" y="378" width="12" height="12" rx="2" fill="#94a3b8"/>
  <text x="410" y="389" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#475569">Sector ETF</text>
</svg>
