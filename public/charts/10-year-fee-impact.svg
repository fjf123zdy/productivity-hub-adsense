<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="fee-impact-title fee-impact-desc">
  <title id="fee-impact-title">10-Year Fee Impact on $100,000 Investment</title>
  <desc id="fee-impact-desc">Bar chart showing total fees paid over 10 years: VOO $344, IVV $344, 510300 $2,300, ASHR $7,475, SMH $4,025</desc>
  <defs>
    <linearGradient id="fiGradUS" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="fiGradCN" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="fiGradCB" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
  </defs>

  <rect width="700" height="420" fill="#fafbfc" rx="8"/>

  <text x="40" y="38" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700" fill="#0f172a">10-Year Fee Impact (Assumes 7% Annual Return Before Fees)</text>
  <text x="40" y="58" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#64748b">Based on $100,000 initial investment. Fund provider filings, mid-2026.</text>

  <!-- Grid -->
  <line x1="110" y1="80" x2="110" y2="350" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="260" y1="80" x2="260" y2="350" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="410" y1="80" x2="410" y2="350" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="560" y1="80" x2="560" y2="350" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="110" y="370" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">$0</text>
  <text x="260" y="370" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">$2,000</text>
  <text x="410" y="370" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">$4,000</text>
  <text x="560" y="370" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">$6,000</text>

  <line x1="110" y1="350" x2="620" y2="350" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Scale: max $8,000 = 510px bar area. Each $1 = 0.06375px from x=110 -->
  <!-- VOO $344/yr*10 → bar to x=110+344*0.51=285 -->
  <rect x="110" y="90" width="175" height="28" rx="4" fill="url(#fiGradUS)"/>
  <text x="100" y="109" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">VOO (0.03%)</text>
  <text x="291" y="109" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#2563eb" font-weight="700">$344</text>
  <text x="620" y="109" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">0.34% of principal</text>

  <!-- IVV $344 → same -->
  <rect x="110" y="130" width="175" height="28" rx="4" fill="url(#fiGradUS)"/>
  <text x="100" y="149" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">IVV (0.03%)</text>
  <text x="291" y="149" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#2563eb" font-weight="700">$344</text>
  <text x="620" y="149" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">0.34% of principal</text>

  <!-- 510300 $2,300 → bar to x=110+2300*0.51=1283... too big. Scale to $8,000=510px. 2300→x=110+2300*0.06375=257 -->
  <rect x="110" y="170" width="147" height="28" rx="4" fill="url(#fiGradCN)"/>
  <text x="100" y="189" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">510300 (0.20%)</text>
  <text x="263" y="189" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#dc2626" font-weight="700">$2,300</text>
  <text x="620" y="189" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">2.3% of principal — 6.7× VOO</text>

  <!-- MCHI $6,785 → x=110+6785*0.06375=542 -->
  <rect x="110" y="210" width="432" height="28" rx="4" fill="url(#fiGradCB)"/>
  <text x="100" y="229" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">MCHI (0.59%)</text>
  <text x="548" y="229" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#7c3aed" font-weight="700">$6,785</text>
  <text x="620" y="229" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">6.8% of principal — 19.7× VOO</text>

  <!-- ASHR $7,475 → x=110+7475*0.06375=586 -->
  <rect x="110" y="250" width="476" height="28" rx="4" fill="url(#fiGradCB)"/>
  <text x="100" y="269" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">ASHR (0.65%)</text>
  <text x="592" y="269" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#7c3aed" font-weight="700">$7,475</text>
  <text x="620" y="269" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">7.5% of principal — 21.7× VOO</text>

  <!-- QDII Nasdaq $9,200 → x=110+9200*0.06375=696.5... too far. Max bar =620. Truncate with marker -->
  <rect x="110" y="290" width="510" height="28" rx="4" fill="url(#fiGradCB)"/>
  <text x="100" y="309" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">QDII Nasdaq (0.80%)</text>
  <text x="620" y="309" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#7c3aed" font-weight="700">$9,200+</text>
  <text x="620" y="327" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">9.2% of principal — 26.7× VOO</text>

  <!-- Callout -->
  <rect x="40" y="350" width="340" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="54" y="369" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#b45309">Fee drag compounds: the gap between VOO and QDII is $8,856 over 10 years</text>
</svg>
