<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="fee-impact-title fee-impact-desc">
  <title id="fee-impact-title">10-Year Fee Impact on $100,000 Investment</title>
  <desc id="fee-impact-desc">Bar chart showing total fees paid over 10 years: VOO $344, IVV $344, 510300 $2,300, MCHI $6,785, ASHR $7,475, QDII Nasdaq $9,200</desc>
  <defs>
    <linearGradient id="fiGradUS" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="fiGradCN" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="fiGradCB" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
  </defs>

  <rect width="700" height="400" fill="#fafbfc" rx="8"/>

  <text x="40" y="38" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700" fill="#0f172a">10-Year Fee Impact (Assumes 7% Annual Return Before Fees)</text>
  <text x="40" y="58" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#64748b">Based on $100,000 initial investment. Fund provider filings, mid-2026.</text>

  <!-- Scale: $10,000 = 460px from x=200 (0.046px/$). Gridlines: $0=200, $2.5K=315, $5K=430, $7.5K=545, $10K=660 -->
  <line x1="200" y1="80" x2="200" y2="330" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="315" y1="80" x2="315" y2="330" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="430" y1="80" x2="430" y2="330" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="545" y1="80" x2="545" y2="330" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="660" y1="80" x2="660" y2="330" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <line x1="200" y1="330" x2="690" y2="330" stroke="#cbd5e1" stroke-width="1"/>

  <text x="200" y="348" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">$0</text>
  <text x="315" y="348" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">$2,500</text>
  <text x="430" y="348" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">$5,000</text>
  <text x="545" y="348" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">$7,500</text>
  <text x="660" y="348" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">$10,000</text>

  <!-- Row centers: 104, 144, 184, 224, 264, 304 -->

  <!-- VOO $344 → 16px -->
  <rect x="200" y="90" width="16" height="28" rx="4" fill="url(#fiGradUS)"/>
  <text x="190" y="100" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">VOO (0.03%)</text>
  <text x="190" y="114" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">0.34% of principal</text>
  <text x="222" y="109" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#2563eb" font-weight="700">$344</text>

  <!-- IVV $344 → 16px -->
  <rect x="200" y="130" width="16" height="28" rx="4" fill="url(#fiGradUS)"/>
  <text x="190" y="140" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">IVV (0.03%)</text>
  <text x="190" y="154" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">0.34% of principal</text>
  <text x="222" y="149" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#2563eb" font-weight="700">$344</text>

  <!-- 510300 $2,300 → 106px -->
  <rect x="200" y="170" width="106" height="28" rx="4" fill="url(#fiGradCN)"/>
  <text x="190" y="180" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">510300 (0.20%)</text>
  <text x="190" y="194" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">2.3% of principal · 6.7× VOO</text>
  <text x="312" y="189" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#dc2626" font-weight="700">$2,300</text>

  <!-- MCHI $6,785 → 312px -->
  <rect x="200" y="210" width="312" height="28" rx="4" fill="url(#fiGradCB)"/>
  <text x="190" y="220" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">MCHI (0.59%)</text>
  <text x="190" y="234" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">6.8% of principal · 19.7× VOO</text>
  <text x="518" y="229" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#7c3aed" font-weight="700">$6,785</text>

  <!-- ASHR $7,475 → 344px -->
  <rect x="200" y="250" width="344" height="28" rx="4" fill="url(#fiGradCB)"/>
  <text x="190" y="260" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">ASHR (0.65%)</text>
  <text x="190" y="274" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">7.5% of principal · 21.7× VOO</text>
  <text x="550" y="269" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#7c3aed" font-weight="700">$7,475</text>

  <!-- QDII $9,200 → 423px -->
  <rect x="200" y="290" width="423" height="28" rx="4" fill="url(#fiGradCB)"/>
  <text x="190" y="300" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" text-anchor="end" font-weight="600">QDII Nasdaq (0.80%)</text>
  <text x="190" y="314" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">9.2% of principal · 26.7× VOO</text>
  <text x="629" y="309" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#7c3aed" font-weight="700">$9,200</text>

  <!-- Callout -->
  <rect x="40" y="362" width="440" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="54" y="381" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#b45309">Fee drag compounds: the gap between VOO and QDII is $8,856 over 10 years</text>
</svg>
