<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="perf-title perf-desc">
  <title id="perf-title">S&amp;P 500 vs CSI 300 ETF Performance (2022–2026 H1)</title>
  <desc id="perf-desc">Line chart comparing VOO and 510300 annual returns: 2022 (-19% vs -21%), 2023 (+26% vs -11%), 2024 (+26% vs +18%), 2025 (+25% vs +15%), 2026 H1 (+11% vs +8%)</desc>
  <defs>
    <linearGradient id="areaVOO" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb" stop-opacity="0.15"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/></linearGradient>
    <linearGradient id="area510300" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dc2626" stop-opacity="0.12"/><stop offset="100%" stop-color="#dc2626" stop-opacity="0"/></linearGradient>
  </defs>

  <rect width="700" height="420" fill="#fafbfc" rx="8"/>

  <text x="40" y="38" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Annual Return: VOO (S&amp;P 500) vs 510300 (CSI 300) — 2022 to 2026 H1</text>
  <text x="40" y="58" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#64748b">Total return, USD. Sources: Vanguard, Huatai-PineBridge, Yahoo Finance.</text>

  <!-- Chart area: x-axis at 100, 210, 320, 430, 540. y=350 is baseline. Range: -25% to +30% → 55% range. y=90 to y=350 → 260px. Each 1% = 4.73px. -->
  <!-- y=0% at y = 350 - (0+25)*4.73 = 350 - 118 = 232 -->
  <!-- y-tick positions: -25%→y=350, -20%→y=326, -15%→y=303, -10%→y=279, -5%→y=255, 0%→y=232, +5%→y=208, +10%→y=185, +15%→y=161, +20%→y=138, +25%→y=114, +30%→y=90 -->

  <!-- Grid lines -->
  <line x1="40" y1="350" x2="620" y2="350" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="40" y1="279" x2="620" y2="279" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="40" y1="232" x2="620" y2="232" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="185" x2="620" y2="185" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="40" y1="138" x2="620" y2="138" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="40" y1="90" x2="620" y2="90" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Y-axis labels -->
  <text x="30" y="354" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">-25%</text>
  <text x="30" y="283" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">-10%</text>
  <text x="30" y="236" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">0%</text>
  <text x="30" y="189" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">+10%</text>
  <text x="30" y="142" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">+20%</text>
  <text x="30" y="94" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">+30%</text>

  <!-- X-axis labels: 5 data points at x=100, 210, 320, 430, 540 -->
  <line x1="100" y1="350" x2="100" y2="358" stroke="#cbd5e1" stroke-width="1"/>
  <text x="100" y="374" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2022</text>
  <line x1="210" y1="350" x2="210" y2="358" stroke="#cbd5e1" stroke-width="1"/>
  <text x="210" y="374" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2023</text>
  <line x1="320" y1="350" x2="320" y2="358" stroke="#cbd5e1" stroke-width="1"/>
  <text x="320" y="374" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2024</text>
  <line x1="430" y1="350" x2="430" y2="358" stroke="#cbd5e1" stroke-width="1"/>
  <text x="430" y="374" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2025</text>
  <line x1="540" y1="350" x2="540" y2="358" stroke="#cbd5e1" stroke-width="1"/>
  <text x="540" y="374" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2026 H1</text>

  <!-- Area fills (trapezoids under lines). y(value) = 232 - value*4.73 -->
  <!-- VOO area: 2022(-19%→322), 2023(+26%→109), 2024(+26%→109), 2025(+25%→114), 2026(+11%→180) -->
  <polygon points="100,322 210,109 320,109 430,114 540,180 540,350 100,350" fill="url(#areaVOO)"/>
  <!-- 510300 area: 2022(-21%→331), 2023(-11%→284), 2024(+18%→147), 2025(+15%→161), 2026(+8%→194) -->
  <polygon points="100,331 210,284 320,147 430,161 540,194 540,350 100,350" fill="url(#area510300)"/>

  <!-- VOO line -->
  <polyline points="100,322 210,109 320,109 430,114 540,180" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 510300 line -->
  <polyline points="100,331 210,284 320,147 430,161 540,194" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Dots + labels for VOO -->
  <circle cx="100" cy="322" r="4" fill="#2563eb"/>
  <text x="100" y="312" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">-19%</text>
  <circle cx="210" cy="109" r="4" fill="#2563eb"/>
  <text x="210" y="100" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">+26%</text>
  <circle cx="320" cy="109" r="4" fill="#2563eb"/>
  <text x="320" y="100" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">+26%</text>
  <circle cx="430" cy="114" r="4" fill="#2563eb"/>
  <text x="430" y="100" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">+25%</text>
  <circle cx="540" cy="180" r="4" fill="#2563eb"/>
  <text x="540" y="173" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">+11%</text>

  <!-- Dots + labels for 510300 -->
  <circle cx="100" cy="331" r="4" fill="#dc2626"/>
  <text x="100" y="346" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#dc2626" font-weight="600" text-anchor="middle">-21%</text>
  <circle cx="210" cy="284" r="4" fill="#dc2626"/>
  <text x="210" y="300" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#dc2626" font-weight="600" text-anchor="middle">-11%</text>
  <circle cx="320" cy="147" r="4" fill="#dc2626"/>
  <text x="320" y="140" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#dc2626" font-weight="600" text-anchor="middle">+18%</text>
  <circle cx="430" cy="161" r="4" fill="#dc2626"/>
  <text x="430" y="154" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#dc2626" font-weight="600" text-anchor="middle">+15%</text>
  <circle cx="540" cy="194" r="4" fill="#dc2626"/>
  <text x="540" y="210" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#dc2626" font-weight="600" text-anchor="middle">+8%</text>

  <!-- Legend -->
  <rect x="460" y="80" width="140" height="52" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="472" y="90" width="16" height="2" rx="1" fill="#2563eb"/>
  <circle cx="480" cy="91" r="3" fill="#2563eb"/>
  <text x="494" y="95" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#334155">VOO (S&amp;P 500)</text>
  <rect x="472" y="112" width="16" height="2" rx="1" fill="#dc2626"/>
  <circle cx="480" cy="113" r="3" fill="#dc2626"/>
  <text x="494" y="117" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#334155">510300 (CSI 300)</text>
</svg>
