<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="voo-title voo-desc">
  <title id="voo-title">VOO Assets Under Management Growth (2010–2026)</title>
  <desc id="voo-desc">Bar chart of VOO AUM: $1B in 2010, $150B in 2020, $380B in 2023, $680B in 2025, $1 trillion in 2026</desc>
  <defs>
    <linearGradient id="aumGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="aumGradFinal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#047857"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  </defs>

  <rect width="700" height="400" fill="#fafbfc" rx="8"/>

  <text x="40" y="38" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700" fill="#0f172a">VOO's Rise to $1 Trillion (AUM, 2010–2026)</text>
  <text x="40" y="58" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#64748b">Vanguard S&amp;P 500 ETF assets under management. Source: Vanguard, fund flow reports.</text>

  <!-- Scale: $1,000B = 240px. y(v) = 330 - v*0.24 -->
  <line x1="70" y1="330" x2="650" y2="330" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="70" y1="270" x2="650" y2="270" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="70" y1="210" x2="650" y2="210" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="70" y1="150" x2="650" y2="150" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="70" y1="90" x2="650" y2="90" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="60" y="334" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">$0</text>
  <text x="60" y="274" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">$250B</text>
  <text x="60" y="214" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">$500B</text>
  <text x="60" y="154" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">$750B</text>
  <text x="60" y="94" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">$1T</text>

  <!-- 2010: $1B → 3px (min visible) -->
  <rect x="110" y="327" width="72" height="3" rx="2" fill="url(#aumGrad)"/>
  <text x="146" y="318" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#047857" font-weight="700" text-anchor="middle">$1B</text>
  <text x="146" y="350" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" font-weight="600" text-anchor="middle">2010</text>
  <text x="146" y="365" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Inception</text>

  <!-- 2020: $150B → 36px -->
  <rect x="222" y="294" width="72" height="36" rx="3" fill="url(#aumGrad)"/>
  <text x="258" y="285" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#047857" font-weight="700" text-anchor="middle">$150B</text>
  <text x="258" y="350" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" font-weight="600" text-anchor="middle">2020</text>
  <text x="258" y="365" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">$100B crossed 2019</text>

  <!-- 2023: $380B → 91px -->
  <rect x="334" y="239" width="72" height="91" rx="3" fill="url(#aumGrad)"/>
  <text x="370" y="230" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#047857" font-weight="700" text-anchor="middle">$380B</text>
  <text x="370" y="350" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" font-weight="600" text-anchor="middle">2023</text>
  <text x="370" y="365" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Inflow leader</text>

  <!-- 2025: $680B → 163px -->
  <rect x="446" y="167" width="72" height="163" rx="3" fill="url(#aumGrad)"/>
  <text x="482" y="158" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#047857" font-weight="700" text-anchor="middle">$680B</text>
  <text x="482" y="350" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" font-weight="600" text-anchor="middle">2025</text>
  <text x="482" y="365" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Overtook SPY</text>

  <!-- 2026: $1,000B → 240px -->
  <rect x="558" y="90" width="72" height="240" rx="3" fill="url(#aumGradFinal)"/>
  <text x="594" y="80" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" fill="#065f46" font-weight="700" text-anchor="middle">$1.0T</text>
  <text x="594" y="350" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" font-weight="600" text-anchor="middle">2026</text>
  <text x="594" y="365" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#047857" font-weight="600" text-anchor="middle">First $1T ETF</text>
</svg>
