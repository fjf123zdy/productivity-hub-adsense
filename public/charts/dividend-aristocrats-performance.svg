<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 396" role="img" aria-labelledby="nobbl-title nobl-desc">
  <title id="nobl-title">NOBL vs S&amp;P 500 Annual Returns (2022–2026 YTD)</title>
  <desc id="nobl-desc">Grouped bar chart: NOBL underperforms VOO in bull years (2024, 2025) but fell 13pp less in the 2022 bear market</desc>
  <defs>
    <linearGradient id="noblGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="vooGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="noblGradDn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="vooGradDn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
  </defs>

  <rect width="700" height="396" fill="#fafbfc" rx="8"/>

  <text x="40" y="38" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700" fill="#0f172a">The Aristocrat Tradeoff: Lag in Bulls, Cushion in Bears</text>
  <text x="40" y="58" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#64748b">NOBL vs VOO annual total return. Source: ProShares, Vanguard, Yahoo Finance.</text>

  <!-- Zero line at y=230. Scale 4.6px/%. Gridlines: +30→92, +20→138, +10→184, -10→276, -20→322 -->
  <line x1="90" y1="92" x2="640" y2="92" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="90" y1="138" x2="640" y2="138" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="90" y1="184" x2="640" y2="184" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="90" y1="230" x2="640" y2="230" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="90" y1="276" x2="640" y2="276" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="90" y1="322" x2="640" y2="322" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="80" y="96" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">+30%</text>
  <text x="80" y="142" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">+20%</text>
  <text x="80" y="188" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">+10%</text>
  <text x="80" y="234" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">0%</text>
  <text x="80" y="280" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">-10%</text>
  <text x="80" y="326" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">-20%</text>

  <!-- 2022: NOBL -6, VOO -19 -->
  <rect x="122" y="230" width="44" height="28" rx="3" fill="url(#noblGradDn)"/>
  <text x="144" y="272" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#059669" font-weight="700" text-anchor="middle">-6%</text>
  <rect x="174" y="230" width="44" height="87" rx="3" fill="url(#vooGradDn)"/>
  <text x="196" y="331" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">-19%</text>
  <text x="170" y="356" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" font-weight="600" text-anchor="middle">2022</text>

  <!-- 2024: NOBL +8, VOO +26 -->
  <rect x="252" y="193" width="44" height="37" rx="3" fill="url(#noblGrad)"/>
  <text x="274" y="186" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#059669" font-weight="600" text-anchor="middle">+8%</text>
  <rect x="304" y="110" width="44" height="120" rx="3" fill="url(#vooGrad)"/>
  <text x="326" y="103" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="600" text-anchor="middle">+26%</text>
  <text x="300" y="356" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" font-weight="600" text-anchor="middle">2024</text>

  <!-- 2025: NOBL +10, VOO +25 -->
  <rect x="382" y="184" width="44" height="46" rx="3" fill="url(#noblGrad)"/>
  <text x="404" y="177" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#059669" font-weight="600" text-anchor="middle">+10%</text>
  <rect x="434" y="115" width="44" height="115" rx="3" fill="url(#vooGrad)"/>
  <text x="456" y="108" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="600" text-anchor="middle">+25%</text>
  <text x="430" y="356" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" font-weight="600" text-anchor="middle">2025</text>

  <!-- 2026 YTD: NOBL +8, VOO +11 -->
  <rect x="512" y="193" width="44" height="37" rx="3" fill="url(#noblGrad)"/>
  <text x="534" y="186" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#059669" font-weight="600" text-anchor="middle">+8%</text>
  <rect x="564" y="179" width="44" height="51" rx="3" fill="url(#vooGrad)"/>
  <text x="586" y="172" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#2563eb" font-weight="600" text-anchor="middle">+11%</text>
  <text x="560" y="356" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#334155" font-weight="600" text-anchor="middle">2026 YTD</text>

  <!-- Legend (upper-left, above the negative 2022 bars) -->
  <rect x="95" y="64" width="180" height="52" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="107" y="74" width="12" height="12" rx="2" fill="#10b981"/>
  <text x="125" y="84" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#334155">NOBL (Aristocrats)</text>
  <rect x="107" y="92" width="12" height="12" rx="2" fill="#3b82f6"/>
  <text x="125" y="102" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#334155">VOO (S&amp;P 500)</text>

  <!-- Callout -->
  <rect x="90" y="366" width="440" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="100" y="380" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#b45309">2022 bear market: NOBL fell 13pp less — the payoff for lagging in bull years</text>
</svg>
